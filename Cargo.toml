[package]
name = "thanatos"
version = "0.2.2"
authors = ["yurzhang <yurzhang.oi@gmail.com>"]
edition = "2024"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
dotenvy_macro = "0.15.7"
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "signal"] }
novel-api = "0.19.0"

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dependencies.axum]
version = "0.8.9"
default-features = false
features = ["http1", "json", "tokio", "query"]
